services:
  internal_edo_api:
    build:
      context: ..
      dockerfile: deploy/internal_edo_api/Dockerfile
    container_name: internal_edo_api
    env_file:
      - .env
    environment:
      GOTENBERG_URL: http://gotenberg:3000
    depends_on:
      gotenberg:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "8122:8122"

  # Конвертер docx -> pdf (LibreOffice внутри). Наружу порт не публикуем:
  # доступен только из сети compose по адресу http://gotenberg:3000
  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: gotenberg
    command:
      - "gotenberg"
      - "--api-timeout=60s"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
