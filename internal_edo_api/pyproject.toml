[project]
name = "internal_edo_api"
version = "0.1.0"
package-mode = false
description = ""
authors = [
    {name = "labanurkamal",email = "kydomoongo@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "asyncpg (>=0.31.0,<0.32.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "pydantic-settings (>=2.14.1,<3.0.0)",
    "aiofiles (>=25.1.0,<26.0.0)",
    "uvicorn (>=0.49.0,<0.50.0)",
    "httpx[http2] (>=0.28.1,<0.29.0)",
    "tenacity (>=9.1.4,<10.0.0)",
    "python-dateutil (>=2.9.0.post0,<3.0.0)",
    "colorlog (>=6.10.1,<7.0.0)",
    "black (>=26.5.1,<27.0.0)",
    "sqlalchemy (>=2.0.52,<3.0.0)",
    "docxtpl (>=0.20.2,<0.21.0)",
    "minio (>=7.2.20,<8.0.0)",
    "fastapi (>=0.141.1,<0.142.0)",
    "openpyxl (>=3.1.5,<4.0.0)",
    "num2words (>=0.5.14,<0.6.0)",
    "python-multipart (>=0.0.32,<0.0.33)",
    "pytrovich (>=0.2.0,<0.3.0)"
]

[tool.poetry]
packages = [{include = "*", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
